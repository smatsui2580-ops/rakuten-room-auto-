  # 季節のキーワード（その月だけ通常のキーワードに混ぜる。月: [キーワード]）
  seasonal_keywords:
    1: ["バレンタイン チョコ ギフト おしゃれ", "湯たんぽ かわいい", "ルームウェア もこもこ かわいい", "ハンドクリーム ギフト おしゃれ"]
