    3: ["新生活 インテリア雑貨 おしゃれ", "お弁当箱 おしゃれ 木製", "入学祝い ギフト かわいい", "お花見 レジャーシート おしゃれ"]
    4: ["母の日 ギフト おしゃれ", "母の日 花 ギフト", "ピクニック バスケット おしゃれ", "水筒 おしゃれ かわいい"]
    5: ["母の日 プレゼント 雑貨", "父の日 ギフト おしゃれ", "梅雨 傘 おしゃれ レディース", "レインブーツ おしゃれ"]
    6: ["父の日 プレゼント おしゃれ", "風鈴 おしゃれ ガラス", "グラス おしゃれ 涼しげ", "お中元 ギフト おしゃれ"]
    7: ["ハンディファン おしゃれ かわいい", "麦わら帽子 レディース おしゃれ", "かき氷 器 ガラス", "ひんやり タオル かわいい"]
    8: ["敬老の日 ギフト おしゃれ", "保冷 タンブラー おしゃれ", "お月見 飾り かわいい", "ガラス 花瓶 おしゃれ"]
    9: ["敬老の日 プレゼント 雑貨", "ハロウィン 飾り おしゃれ", "秋 インテリア 雑貨 ほっこり", "ブックカバー おしゃれ かわいい"]
    10: ["ハロウィン 雑貨 かわいい", "クリスマス アドベントカレンダー", "ひざ掛け あったか おしゃれ", "キャンドル おしゃれ ギフト"]
    11: ["クリスマス オーナメント 北欧", "クリスマスツリー 卓上 おしゃれ", "クリスマス プレゼント プチギフト 女性", "湯たんぽ かわいい", "加湿器 卓上 おしゃれ"]
    12: ["クリスマス プレゼント 雑貨 おしゃれ", "正月飾り おしゃれ モダン", "お年賀 ギフト かわいい", "土鍋 おしゃれ", "福袋 2027 雑貨"]

  # 未投稿の候補が見つかるまで、検索結果を何ページ目まで見るか（1ページ目＝上位商品）
  max_pages: 3

  # （旧設定・現在は未使用）
  items_per_search: 5

  # 商品フィルタリング条件
  min_review_count: 20       # レビュー数の最低ライン（売れている実績の目安）
  min_review_average: 4.0    # 平均評価の最低ライン
  min_price: 500             # 最低価格（円）
  max_price: 30000           # 最高価格（円）
  sort: "standard"           # ソート順: standard(標準), -reviewCount(レビュー数降順), -updateTimestamp(新着)

# 投稿設定
posting:
  # 1回の実行あたりの投稿件数（通常の日）。連投を避けるため1件ずつ
  posts_per_run: 1
  # セール時（5と0のつく日・お買い物マラソン等）の1回あたりの投稿件数
  sale_posts_per_run: 2
  # 同じ実行の中で2件目以降を出すまでの間隔（分）。この範囲でランダム
  gap_minutes: [20, 30]
  # 検索結果の商品名に「マラソン」「スーパーSALE」等が入っている割合がこれ以上ならセール中とみなす
  sale_word_threshold: 0.2
  # セール期間を手で指定したい場合（例: [["2026-12-04", "2026-12-11"]]）。空でも自動判定は動く
  sale_periods: []

  # 投稿スケジュール（HH:MM 形式、複数設定可）
  schedule_times:
    - "07:00"
    - "09:00"
    - "11:00"
    - "13:00"
    - "15:00"
    - "17:00"
    - "19:00"
    - "21:00"
    - "22:30"

  # 同じ商品を何日後なら再投稿OKか
  repost_interval_days: 14

# キャプション生成設定
caption:
  # キャプションのトーン
  tone: "ほっこり癒し系・絵本のような世界観・女性向け・絵文字多め"
  # 最大文字数
  max_length: 350
  # ハッシュタグを自動追加するか
  add_hashtags: true
  # 追加するハッシュタグ数
  hashtag_count: 7

# ブラウザ設定
browser:
  # headless: true にすると画面が表示されない（本番向け）
  # headless: false にするとブラウザ画面が見える（デバッグ向け）
  headless: false
  # 操作間のウェイト（秒）。サイトに負荷をかけないよう適度に設定
  action_delay: 2

# 自動フォロー設定
follow:
  # 自分の楽天ROOMユーザーID（URLの room.rakuten.co.jp/room/◯◯◯ の部分）
  my_room_user_id: "room_1988b87b48"
  # 1回の実行でフォローする最大件数
  max_follows: 5
  # 同じユーザーを再フォローするまでの日数
  refollow_days: 30
  # 自動フォローを有効にするか
  enabled: true
  # フォロー対象を探すキーワード（シンプルな単語で）
  search_keywords:
    - "おうちカフェ"
    - "キッチン雑貨"
    - "北欧インテリア"
    - "ナチュラル雑貨"
    - "丁寧な暮らし"
    - "インテリア雑貨"
    - "おしゃれ雑貨"
    - "カフェインテリア"
    - "ナチュラルインテリア"
    - "暮らしを楽しむ"
    - "シンプルライフ"
    - "ほっこり雑貨"
    - "テーブルコーディネート"
    - "おしゃれなくらし"
    - "植物インテリア"
    - "カフェ風インテリア"
    - "お気に入りのもの"
    - "暮らしの道具"
    - "キッチンインテリア"
    - "北欧雑貨"

# 自動いいね設定（ROOMランク条件の「検索」「投稿へのいいね」を満たすため。フォロー実行の後に走る）
like:
  enabled: true
  # 1回の実行でいいねする最大件数（少量にとどめる）
  max_likes: 5
  # 検索に使うキーワード（省略時は search.keywords を使う）
  # search_keywords: []
