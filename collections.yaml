# コレクションの定義
# - name: コレクション名（50文字まで）
# - about: 説明
# - any: 商品名にこのどれかが入っていれば対象
# - exclude: 商品名にこれが入っていれば対象外（省略可）
# - max_price / min_price: 価格の条件（省略可）
# 1つのコレクションには max_items 件まで（いいねが多い順→新しい順）。min_items 件に満たないテーマは作らない
max_items: 30
min_items: 6
# AIに判定させる候補の数（テーマごと・いいねが多い順）
judge_candidates: 75

themes:
  - key: xmas_deco
    name: "クリスマスを楽しむ雑貨🎄"
    about: "ツリーやオーナメントなどの飾りと、クリスマス限定の贈り物を集めました。クリスマス専用の飾り・柄・限定品だけが対象です。"
    any: ["クリスマス", "ツリー", "オーナメント", "サンタ", "アドベント", "リース", "スノードーム"]

  - key: petit_gift
    name: "2,000円以下のプチギフト🎁"
    about: "ちょっとしたお礼やお祝いに。2,000円以下で選べる、もらってうれしい贈り物です。"
    any: ["ギフト", "プレゼント", "贈り物", "お祝い", "内祝"]
    max_price: 2000

  - key: winter
    name: "あったか冬じたく☃️"
    about: "寒い季節をぬくぬく過ごすための、あったかアイテムを集めました。"
    any: ["ブランケット", "湯たんぽ", "ルームシューズ", "あったか", "もこもこ", "ひざ掛け", "ひざかけ", "毛布", "加湿器", "裏起毛", "カイロ"]
    exclude: ["犬服", "猫服", "ペット", "座布団カバー"]

  - key: cafe
    name: "おうちカフェのうつわ☕"
    about: "おうちでのお茶の時間が楽しみになる、マグカップやプレート、ティーポットたち。"
    any: ["マグ", "カップ", "ソーサー", "プレート", "小鉢", "ティーポット", "急須", "グラス", "ドリッパー", "コースター", "食器"]
    exclude: ["歯ブラシ", "植木鉢", "プランター", "カップ麺"]

  - key: kitchen
    name: "木のぬくもりキッチン道具🌿"
    about: "毎日のお料理がちょっと楽しくなる、木や自然素材のキッチン道具を集めました。"
    any: ["まな板", "カッティングボード", "トレー", "トレイ", "カトラリー", "鍋敷き", "キャニスター", "保存容器", "エプロン", "ランチョンマット", "お弁当箱", "弁当箱"]

  - key: clock
    name: "北欧テイストの時計とミラー🕰"
    about: "お部屋の雰囲気をやさしく変えてくれる、時計とミラーのコレクションです。"
    any: ["時計", "ミラー", "鏡"]
    exclude: ["腕時計", "ミラーレス"]

  - key: green
    name: "グリーンと花のある暮らし🪴"
    about: "植木鉢や花びん、ドライフラワーなど、お部屋に緑と花を取り入れる雑貨たち。"
    any: ["植木鉢", "プランター", "観葉植物", "ドライフラワー", "スワッグ", "ガーデニング", "花瓶", "フラワーベース", "鉢カバー", "ポットフィート", "多肉"]

  - key: bath
    name: "香りとバスタイムのごほうび🛁"
    about: "一日の終わりに自分をいたわる、入浴剤やクリーム、香りのアイテムです。"
    any: ["入浴剤", "バスソルト", "バスボム", "ボディクリーム", "ハンドクリーム", "フレグランス", "ディフューザー", "リップ", "アロマ", "キャンドル", "石鹸", "石けん", "ソープ"]
    exclude: ["ソープディスペンサー", "ディスペンサー"]

  - key: stationery
    name: "かわいい文具と手帳✏️"
    about: "机に向かうのが楽しくなる、手帳やカレンダー、レターセットなどの文具を集めました。"
    any: ["手帳", "カレンダー", "レターセット", "ポストカード", "メモ帳", "メモ", "ボールペン", "ペンケース", "ノート", "付箋", "ふせん", "マスキングテープ", "シール"]
    exclude: ["ノートパソコン", "メモリ"]

  - key: iyashi
    name: "癒しのぬいぐるみとかわいい小物🧸"
    about: "見ているだけでほっとする、ぬいぐるみやポーチなどのかわいい小物たち。"
    any: ["ぬいぐるみ", "抱き枕", "ポーチ", "マスコット", "キーホルダー"]
